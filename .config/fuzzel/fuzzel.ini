font=JetBrains Mono:size=10
dpi-aware=no
prompt="> "
terminal=alacritty
launch-prefix=swaymsg exec --

lines=20
width=60
horizontal-pad=8
vertical-pad=4
inner-pad=4

exit-on-keyboard-focus-loss=no

[colors]
background=222222ff
text=bbbbbbff
match=775500ff
selection=005577ff
selection-text=eeeeeeff
border=005577ff
prompt=bbbbbbff
input=bbbbbbff

[border]
width=3
radius=0

[key-bindings]
next=Mod1+j Down Control+n
prev=Mod1+k Up Control+p
